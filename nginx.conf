# Nginx do site público Estudatta: arquivos estáticos, URLs limpas (/idiomas → /idiomas/index.html),
# 404 próprio e cabeçalhos de segurança. TLS fica no proxy da frente (ver README).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # A API do app precisa estar liberada em connect-src (planos, novidades, contato)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self'; style-src 'self'; script-src 'self' https://www.googletagmanager.com; connect-src 'self' https://app.estudatta.com.br https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; form-action 'self' mailto:; base-uri 'self'; frame-ancestors 'none'" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # a página de inglês virou a de idiomas; links antigos continuam funcionando
    absolute_redirect off;  # Location relativo: vale atrás do proxy com HTTPS
    location ~ ^/ingles/?$ { return 301 /idiomas; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
